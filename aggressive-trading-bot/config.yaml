# Configuration for the Aggressive Trading Bot
# CREDENTIALS: set MT5_LOGIN, MT5_PASSWORD, MT5_INVESTOR_PASSWORD as environment variables.
# Never commit real values here. Copy .env.example to .env and fill it in locally.

mt5:
  server: "MetaQuotes-Demo"
  login: ${MT5_LOGIN}
  password: ${MT5_PASSWORD}
  investor_password: ${MT5_INVESTOR_PASSWORD}

trading:
  pairs:
    - "XAU/USD"
    - "CAD/USD"
    - "EUR/USD"
    - "GBP/USD"
  risk_per_trade: 0.005  # 0.5% risk per trade
  stop_loss_pct: 0.005
  take_profit_pct: 0.01

elliott_wave:
  wave_threshold: 0.7
  trend_window: 20

logging:
  level: "INFO"
  file: "trading_bot.log"
